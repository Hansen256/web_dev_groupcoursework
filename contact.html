<section>
    <h2>Contact / Feedback Form</h2>

    <form name="contactForm" onsubmit="return validateForm()">
        <label>Your Name</label>
        <input type="text" name="name" placeholder="Enter your full name" title="Full name">

        <label>Email</label>
        <input type="email" name="email" placeholder="Enter your email address" title="Email address">

        <label>Message</label>
        <textarea name="message" rows="5" placeholder="Enter your message here" title="Message"></textarea>

        <button type="submit">Submit</button>
    </form>
</section>

<script src="js/script.js"></script>
